# Provenance manifest for every data file shipped in src/data (PLAN §0.2).
#
# Policy: every stored table records its original author, the paper DOI, the exact source
# the numbers were taken from, its licence and the date retrieved. Nothing is transcribed
# from the GPL quadpy fork. The CI check in test/test_provenance.jl fails the build for any
# file in this directory without an entry here.

[[file]]
path = "triangle_s3_seeds.toml"
description = """
Float64 seeds (orbit parameters) and orbit structures for fully S3-symmetric, positive,
interior triangle rules of degrees 1-20 at the minimal point counts reported by Xiao &
Gimbutas (2010)."""
authors = "CubatureRules.jl contributors"
source = """
Generated in-house by scripts/generate_triangle_seeds.jl: multistart Levenberg-Marquardt on
the S3-invariant moment system from random interior starts, with only the orbit structure
fixed, then refined to 100 digits and rounded to Float64. No numerical table was consulted.
The point counts (a combinatorial fact stated in the paper's prose and tables, not the
tabulated nodes or weights) are from Xiao & Gimbutas (2010)."""
license = "MIT"
retrieved = "2026-09-18"
citation = "H. Xiao and Z. Gimbutas, Comput. Math. Appl. 59 (2010) 663-676, doi:10.1016/j.camwa.2009.10.027"
generator = "scripts/generate_triangle_seeds.jl"

[[file]]
path = "tetrahedron_s4_seeds.toml"
description = """
Float64 seeds (orbit parameters) and orbit structures for fully S4-symmetric, positive,
interior tetrahedron rules, with the smallest point counts the in-house search reached."""
authors = "CubatureRules.jl contributors"
source = """
Generated in-house by scripts/generate_tetrahedron_seeds.jl: for each degree, a walk upwards
in point count from a bound below which no fully symmetric rule exists, with multistart
Levenberg-Marquardt on the S4-invariant moment system at each count; the winning rule is
refined to 100 digits and rounded to Float64. Neither numbers nor point counts were taken
from any publication."""
license = "MIT"
retrieved = "2026-09-19"
citation = "none (generated in-house)"
generator = "scripts/generate_tetrahedron_seeds.jl"

[[file]]
path = "lebedev_seeds.toml"
description = """
Float64 seeds (orbit parameters) and orbit structures for octahedrally symmetric, positive
sphere rules of odd degree, with the smallest point counts the in-house search reached
subject to positive weights."""
authors = "CubatureRules.jl contributors"
source = """
Generated in-house by scripts/generate_lebedev_seeds.jl: for each odd degree, a walk upwards
in point count with multistart Levenberg-Marquardt on the O_h-invariant moment system at
each count, the winner refined to 100 digits and rounded to Float64. No numbers were taken
from any publication. Lebedev's published point counts appear in the generator only to
annotate its log, and the counts found agree with them except at degree 13, where the
published 74-point rule has a negative weight and the search reports a 78-point positive one
instead."""
license = "MIT"
retrieved = "2026-09-22"
citation = "V. I. Lebedev, USSR Comput. Math. Math. Phys. 16 (1976) 10-24, doi:10.1016/0041-5553(76)90100-2"
generator = "scripts/generate_lebedev_seeds.jl"
