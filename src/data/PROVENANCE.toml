[[file]]
path = "lebedev_seeds.toml"
description = """
Float64 seeds (orbit parameters) and orbit structures for octahedrally symmetric, positive
sphere rules of odd degree: degrees 3-17 with the smallest point counts the in-house search
reached subject to positive weights, and every odd degree 133-201 as a square system, with as
many unknowns as invariant moment conditions."""
authors = "CubatureRules.jl contributors"
source = """
Degrees 3-17: generated in-house by scripts/generate_lebedev_seeds.jl: for each odd degree, a
walk upwards in point count with multistart Levenberg-Marquardt on the O_h-invariant moment
system at each count, the winner refined to 100 digits and rounded to Float64. No numbers were
taken from any publication. Lebedev's published point counts appear in the generator only to
annotate its log, and the counts found agree with them except at degree 13, where the
published 74-point rule has a negative weight and the search reports a 78-point positive one
instead.

Degrees 133-201: computed by the package author's continuation search (September 2026, run
outside this repository). A verified rule at one degree is grown into an underdetermined rule
at the next by adding orbits; orbits are then removed until the system is square, and it is
solved with positive weights by Levenberg-Marquardt in symmetry-adapted spherical harmonics.
Each result was polished to 704 bits in the invariant moment system and checked at 768 bits,
including every symmetry-distinct Cartesian monomial of degree below its own. The chain starts
from the published degree-131 rule of Lebedev & Laikov (1999), which seeded the search for the
degree-133 rule; every rule in the table is a different solution, with its own orbit
structure, and no published numbers appear in it. The author releases these seeds under the
MIT licence. scripts/import_octahedral_rules.jl rounded the high-precision orbit parameters to
Float64."""
license = "MIT"
retrieved = "2026-09-30"
citation = """
V. I. Lebedev, USSR Comput. Math. Math. Phys. 16 (1976) 10-24, doi:10.1016/0041-5553(76)90100-2;
V. I. Lebedev and D. N. Laikov, Doklady Mathematics 59 (1999) 477-481 (the degree-131 rule the
degree 133-201 continuation started from)"""
generator = "scripts/generate_lebedev_seeds.jl (degrees 3-17); scripts/import_octahedral_rules.jl (degrees 133-201)"
checked = """
scripts/certify_tables.jl, 2026-09-24 and 2026-09-30 (degrees 3-17) and 2026-10-01 (degrees
133-201): every seed is the correctly rounded Float64 value of the rule refined to 160 bits,
and its defining-equation residual at 256 bits is recorded in the table."""

[[file]]
path = "square_d4_seeds.toml"
description = """
Float64 seeds (orbit parameters) and orbit structures for fully symmetric, positive,
interior rules on the square [-1, 1]^2, invariant under its 8 symmetries, at odd degrees
1-75."""
authors = "CubatureRules.jl contributors"
source = """
Generated in-house by scripts/generate_box_seeds.jl (2026-10-02): up to degree 13, a walk
upwards in point count with random starts on every orbit structure of each count; above it,
each degree grown from the one below and thinned by node elimination, the best of two runs
(16 and 32 chains) kept per degree. Degrees 33-51 were found by scripts/search_box_campaign.jl
(2026-10-02, the same grow → eliminate moves run for 12 hours), and degrees 53-75 by the
pooled search, scripts/search_campaign/ (2026-10-02/03). Neither numbers nor point counts were
taken from any publication. The counts were compared afterwards with Witherden & Vincent
(2015), who tabulate this class to degree 21: they agree at every degree except 17,
where this table has 57 points against 60."""
license = "MIT"
retrieved = "2026-10-02"
citation = "none (generated in-house); compared with F. D. Witherden and P. E. Vincent, Comput. Math. Appl. 69 (2015) 1232-1241"
generator = "scripts/generate_box_seeds.jl; scripts/search_box_campaign.jl (degrees 33-51); scripts/search_campaign/ (53-75)"
checked = """
scripts/certify_tables.jl, 2026-10-02 (degrees 33-75 on 2026-10-03): every seed is the
correctly rounded Float64 value of the rule refined to 160 bits, and its defining-equation
residual at 256 bits is recorded in the table. scripts/verify_tables.jl at 60 digits."""

[[file]]
path = "cube_oh_seeds.toml"
description = """
Float64 seeds (orbit parameters) and orbit structures for fully symmetric, positive,
interior rules on the cube [-1, 1]^3, invariant under its 48 symmetries, at odd degrees
1-41."""
authors = "CubatureRules.jl contributors"
source = """
Generated in-house by scripts/generate_box_seeds.jl (2026-10-02): up to degree 7, a walk
upwards in point count with random starts on every orbit structure of each count; above it,
each degree grown from the one below and thinned by node elimination. Degrees 19-29, and
smaller rules at degrees 13 (154 points, was 160), 15 (199, was 208) and 17 (282, was 287),
were found by scripts/search_box_campaign.jl (2026-10-02, the same moves run for 12 hours),
and degrees 31-41 by the pooled search, scripts/search_campaign/ (2026-10-02/03). Neither
