degree 3 has its nodes on the faces and these rules keep every node inside."""
license = "MIT"
retrieved = "2026-10-02"
citation = "none (generated in-house); compared with F. D. Witherden and P. E. Vincent, Comput. Math. Appl. 69 (2015) 1232-1241"
generator = "scripts/generate_box_seeds.jl; scripts/search_box_campaign.jl (degrees 13-29); scripts/search_campaign/ (31-41)"
