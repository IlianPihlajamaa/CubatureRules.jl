# Provenance manifest for every data file shipped in src/data (PLAN §0.2).
#
# Policy: every stored table records its original author, the paper DOI, the exact source
# the numbers were taken from, its licence and the date retrieved. Nothing is transcribed
# from the GPL quadpy fork. The CI check in test/test_provenance.jl fails the build for any
# file in this directory without an entry here.

[[file]]
path = "triangle_s3_seeds.toml"
description = """
Float64 seeds (orbit parameters) and orbit structures for fully S3-symmetric, positive,
interior triangle rules of degrees 1-68: to degree 26 at the point counts reported by Xiao &
Gimbutas (2010) (one point more at degree 25), at degrees 27-33 and 35-50 with fewer points
than they report, and at 51-68 beyond the degrees they tabulate."""
authors = "CubatureRules.jl contributors"
source = """
Generated in-house by scripts/generate_triangle_seeds.jl: multistart Levenberg-Marquardt on
the S3-invariant moment system from random interior starts, with only the orbit structure
fixed, then refined to 100 digits and rounded to Float64. Above degree 20, node elimination
from the rule one degree lower (src/refine/elimination.jl); degrees 51-53 by
scripts/search_campaign.jl (2026-09-25/26), 54-56 by the same grow → eliminate chains
(2026-10-01/02), and 57-68 and the smaller rules at degree 35 (225 points, was 226) and 46
(379, was 381) by the pooled search, scripts/search_campaign/ (2026-10-02/03). No numerical
table was consulted. The point counts (a combinatorial fact stated in the paper's prose and
tables, not the tabulated nodes or weights) are from Xiao & Gimbutas (2010)."""
license = "MIT"
retrieved = "2026-09-18"
citation = "H. Xiao and Z. Gimbutas, Comput. Math. Appl. 59 (2010) 663-676, doi:10.1016/j.camwa.2009.10.027"
generator = "scripts/generate_triangle_seeds.jl; scripts/search_campaign.jl (degrees 51-56); scripts/search_campaign/ (35, 46, 57-68)"
checked = """
scripts/certify_tables.jl, 2026-09-24 (degrees 35, 46 and 54-68 on 2026-10-03): every seed
is the correctly rounded Float64 value of the rule refined to 160 bits (the degree-11
triangle seed was 3 ulp off and was replaced), and its defining-equation residual at 256
bits is recorded in the table."""

