# The per-commit run: the whole OS x Julia matrix, but only a slice of the shipped seed
# tables. CI-full.yml checks every degree in them, on tags, weekly and on demand — building
# high-degree symmetric rules is what costs, and the tables keep growing.
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']              # a release tag builds and deploys the docs for that version
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # The whole OS × Julia-version matrix runs test/test_reproducibility.jl, which compares
    # rule hashes against test/reference_hashes.toml: identical rule(...) calls must give
    # bitwise-identical output across versions and platforms.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No 'pre' job: on Julia 1.14.0-alpha1 a test dependency (GenericLinearAlgebra, through
        # DoubleFloats) does not precompile, so it failed before testing anything. Restore it
        # when it can test the package: it shows early a change in random streams, MPFR or
        # LAPACK that would break the reproducibility contract.
        version: ['1.11', '1']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Load time
        shell: bash
        # target: under one second; fails above three, which no runner should need. The first
        # load precompiles (buildpkg does not); the second, in a fresh process, is timed.
        run: |
          julia --project -e 'using CubatureRules'
          julia --project -e 't = @elapsed using CubatureRules
                                println("using CubatureRules: ", round(t; digits = 2), " s")
                                t < 1 || @warn "above the one-second target"
                                t < 3 || error("loading took $(round(t; digits = 2)) s")'
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false          # nothing uploads it; turn back on with a coverage service
        env:
          JULIA_NUM_THREADS: 2
  benchmark:
    # Construction cost is tracked: results are uploaded per commit and
    # compared with those of the last successful run on main.
    name: Construction benchmark
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Previous results
        continue-on-error: true      # the first run, or an expired artifact, has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "${{ github.repository }}" --workflow CI.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$id" --repo "${{ github.repository }}" --name construction-benchmark --dir benchmark/previous
      - run: julia --project benchmark/construction.jl benchmark/results/construction.csv benchmark/previous/construction.csv
      - uses: actions/upload-artifact@v4
        with:
          name: construction-benchmark
          path: benchmark/results/
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path = pwd())); Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
